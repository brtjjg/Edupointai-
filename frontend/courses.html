<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Courses — EduPoint AI</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .dashboard-layout { display: flex; min-height: 100vh; background: #080916; }
  .sidebar { width: 260px; background: #0b0d1d; border-right: 1px solid #303451; padding: 20px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
  .sidebar h3 { color: #73e8ff; font-size: 11px; letter-spacing: 1px; margin: 15px 0 5px 10px; text-transform: uppercase; }
  .sidebar a { color: #aab1ca; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; }
  .sidebar a:hover, .sidebar a.active { background: #1a1c33; color: #fff; }
  .main-content { flex: 1; padding: 30px; }
  .controls { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
  .controls input, .controls select { padding: 12px; border-radius: 8px; border: 1px solid #303451; background: #111326; color: #fff; flex: 1; }
  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .course-card { background: #111326; border: 1px solid #303451; border-radius: 12px; padding: 20px; }
  .course-card h3 { margin: 0 0 10px 0; color: #73e8ff; font-size: 16px; }
  .course-card p { margin: 5px 0; color: #aab1ca; font-size: 13px; }
  .btn-save { background: #15803D; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
</style>
</head><body>
<div class="dashboard-layout">
  <div class="sidebar">
    <div class="brand" style="font-size: 18px; margin-bottom: 20px;">🎓 EduPoint AI</div>
    <h3>Academics</h3>
    <a href="/dashboard.html">🏠 Overview</a>
    <a href="/history.html">📊 Calculation History</a>
    <a href="/comparison.html">⚖️ Academic Comparison</a>
    <a href="/courses.html" class="active">🎓 My Courses</a>
    <h3>Opportunities</h3>
    <a href="/scholarships.html">💰 Scholarships</a>
    <h3>Services</h3>
    <a href="/careers.html">💼 CV & Careers</a>
    <a href="/learning.html">📚 Learning Centre</a>
    <a href="#" onclick="logout(); return false;" style="color: #ff7b7b; margin-top: 20px;">🚪 Logout</a>
  </div>
  <div class="main-content">
    <h1 style="font-size: 28px; margin-bottom: 5px;">Course Recommendation Engine</h1>
    <p style="color: #aab1ca; margin-bottom: 20px;">Search, filter, and save university programmes you are interested in.</p>
    <div class="controls">
      <input type="text" id="searchCourse" placeholder="Search course name or university...">
      <select id="filterUni"><option value="">All Universities</option></select>
      <button class="nav-btn" id="tabAll" style="background: #24306d;">All Courses</button>
      <button class="nav-btn" id="tabSaved" style="background: #111326;">My Saved Courses</button>
    </div>
    <div class="course-grid" id="courseGrid"></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
let savedCourses = [];
let currentTab = 'all';
const RAW_COURSES = [
  { n: "Medicine & Surgery (MBChB)", u: "UNIVERSITY OF NAIROBI", c: 45.584 },
  { n: "Computer Science", u: "UNIVERSITY OF NAIROBI", c: 44.825 },
  { n: "Computer Science", u: "JKUAT", c: 44.101 },
  { n: "Nursing", u: "UNIVERSITY OF NAIROBI", c: 43.676 },
  { n: "Law (LLB)", u: "UNIVERSITY OF NAIROBI", c: 42.500 },
  { n: "Engineering", u: "UNIVERSITY OF NAIROBI", c: 43.463 },
  { n: "Economics", u: "UNIVERSITY OF NAIROBI", c: 26.096 },
  { n: "Business Management", u: "KISII UNIVERSITY", c: 21.375 },
  { n: "Bachelor of Arts", u: "KENYATTA UNIVERSITY", c: 24.057 },
  { n: "Information Technology", u: "JKUAT", c: 39.851 },
  { n: "Agriculture", u: "EGERTON UNIVERSITY", c: 15.864 }
];
(async function init() {
  const r = await requireAuth(); if (!r) return;
  const unis = [...new Set(RAW_COURSES.map(c => c.u))].sort();
  document.getElementById("filterUni").innerHTML += unis.map(u => `<option value="${u}">${u}</option>`).join("");
  await loadSaved(); renderGrid();
  document.getElementById("searchCourse").addEventListener("input", renderGrid);
  document.getElementById("filterUni").addEventListener("change", renderGrid);
  document.getElementById("tabAll").onclick = () => switchTab('all');
  document.getElementById("tabSaved").onclick = () => switchTab('saved');
})();
async function loadSaved() {
  const res = await api("/api/courses/saved");
  savedCourses = res.courses;
}
function switchTab(tab) {
  currentTab = tab;
  document.getElementById("tabAll").style.background = tab === 'all' ? '#24306d' : '#111326';
  document.getElementById("tabSaved").style.background = tab === 'saved' ? '#24306d' : '#111326';
  renderGrid();
}
function renderGrid() {
  const term = document.getElementById("searchCourse").value.toLowerCase();
  const uni = document.getElementById("filterUni").value;
  let list = currentTab === 'all' ? RAW_COURSES : savedCourses;
  if (term) list = list.filter(c => (c.n || c.course_name).toLowerCase().includes(term) || (c.u || c.university).toLowerCase().includes(term));
  if (uni && currentTab === 'all') list = list.filter(c => c.u === uni);
  const grid = document.getElementById("courseGrid");
  if (list.length === 0) { grid.innerHTML = `<p style="color: #aab1ca;">No courses found.</p>`; return; }
  grid.innerHTML = list.map(c => {
    const name = c.n || c.course_name; const uni = c.u || c.university; const cutoff = c.c || c.cutoff;
    const isSaved = savedCourses.some(sc => sc.course_name === name && sc.university === uni);
    return `<div class="course-card"><h3>${name}</h3><p><b>University:</b> ${uni}</p><p><b>Cutoff:</b> ${parseFloat(cutoff).toFixed(3)}</p>
        ${isSaved && currentTab === 'saved' 
          ? `<button class="btn-save" style="background:#ff7b7b;" onclick="removeCourse(${c.id})">Remove</button>`
          : isSaved ? `<button class="btn-save" style="background:#303451; cursor:not-allowed;" disabled>✓ Saved</button>`
          : `<button class="btn-save" onclick="saveCourse('${name}', '${uni}', ${cutoff})">Save Course</button>`}</div>`;
  }).join("");
}
async function saveCourse(name, university, cutoff) {
  try { await api("/api/courses/save", { method: "POST", body: JSON.stringify({ course_name: name, university, cutoff }) }); await loadSaved(); renderGrid(); } catch (e) { alert(e.message); }
}
async function removeCourse(id) { await api(`/api/courses/${id}`, { method: "DELETE" }); await loadSaved(); renderGrid(); }
</script>
</body></html>
