<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — EduPoint AI</title>
<link rel="stylesheet" href="/css/style.css">
</head><body class="auth-page"><main class="auth-wrap"><div class="auth-card">
  <div class="brand">🎓 EduPoint AI <span>v10</span></div>
  <h1>Welcome back</h1>
  <p>Login to continue to EduPoint AI.</p>
  <form id="f">
    <div class="field"><label>Email</label><input name="email" type="email" required></div>
    <div class="field"><label>Password</label><input name="password" type="password" required></div>
    <button class="pay" type="submit">Login</button>
  </form>
  <div id="msg" class="message"></div>
  <p class="auth-switch">New here? <a href="/register.html">Create account</a></p>
  <a class="back-link" href="/index.html">← Back</a>
</div></main>
<script src="/js/api.js"></script>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    const j = await api("/api/login", { method: "POST", body: JSON.stringify(body) });
    setToken(j.token); location.href = j.redirect;
  } catch (err) { document.getElementById("msg").textContent = err.message; }
});
</script></body></html>
