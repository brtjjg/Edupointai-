<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduPoint Admin</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">🎓 EduPoint AI <span>ADMIN</span></div>
  <nav class="top-actions">
    <a class="nav-btn" href="/index.html">Website</a>
    <a class="nav-btn" href="#" onclick="logout();return false;">Logout</a>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <p class="eyebrow">ADMIN PANEL</p>
    <h1>Management dashboard</h1>
  </section>

  <section class="card">
    <h2>Student accounts</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Credits</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="8">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Recent payments</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Transaction</th>
            <th>User</th>
            <th>Network</th>
            <th>Amount</th>
            <th>Plan</th>
            <th>Status</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="paymentsTableBody">
          <tr><td colspan="7">Loading payments...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="/js/api.js"></script>
<script>
(async function () {
  const me = await requireAuth(); 
  if (!me) return;
  
  if (me.user.role !== "admin") { 
    location.href = "/dashboard.html"; 
    return; 
  }

  // Load Users
  try {
    const users = await api("/api/admin/users");
    document.getElementById("usersTableBody").innerHTML = users.users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td>${u.phone}</td>
        <td>${u.role}</td>
        <td><b style="color: #73e8ff;">${u.credits}</b></td>
        <td>${u.active ? "Active" : "Disabled"}</td>
        <td>
          <button class="small-btn" onclick="toggleUser(${u.id})">${u.active ? "Disable" : "Enable"}</button>
          <button class="small-btn" style="border-color: #73e8ff; color: #73e8ff;" onclick="grant(${u.id})">+ Add Credits</button>
        </td>
      </tr>`).join("");
  } catch (err) {
    document.getElementById("usersTableBody").innerHTML = `<tr><td colspan="8" style="color:red;">Error loading users: ${err.message}</td></tr>`;
  }

  // Load Payments
  try {
    const pays = await api("/api/admin/payments");
    document.getElementById("paymentsTableBody").innerHTML = pays.payments.map(p => `
      <tr>
        <td>${p.transaction_id}</td>
        <td>${p.user_id ?? "-"}</td>
        <td>${p.network}</td>
        <td>KES ${p.amount}</td>
        <td>${p.plan}</td>
        <td style="color: ${p.status === 'completed' || p.status === 'paid' ? '#c9ffda' : '#fff'}">${p.status}</td>
        <td>${p.created_at || ""}</td>
      </tr>`).join("");
  } catch (err) {
    document.getElementById("paymentsTableBody").innerHTML = `<tr><td colspan="7" style="color:red;">Error loading payments: ${err.message}</td></tr>`;
  }
})();

async function toggleUser(id) {
  try { 
    await api(`/api/admin/user/${id}/toggle`, { method: "POST" }); 
    location.reload(); 
  } catch (e) { 
    alert(e.message); 
  }
}

async function grant(id) {
  const amount = prompt("How many credits do you want to give this user?", "1");
  
  if (amount === null || isNaN(amount) || parseInt(amount) <= 0) {
    return; // User cancelled or entered invalid amount
  }

  try {
    await api(`/api/admin/access/${id}`, { 
      method: "POST",
      body: JSON.stringify({ credits: parseInt(amount) }) 
    });
    alert(`Successfully added ${amount} credits!`);
    location.reload();
  } catch (e) { 
    alert(e.message); 
  }
}
</script>

</body>
</html>
