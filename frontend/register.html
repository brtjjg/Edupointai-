<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — EduPoint AI</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head><body class="auth-page"><main class="auth-wrap"><div class="auth-card">
  <div class="brand">🎓 EduPoint AI <span>v10</span></div>
  <h1>Create your account</h1>
  <p>You'll get 1 Free Calculation when you sign up!</p>
  
  <!-- Google Sign In Button -->
  <div id="g_id_onload"
       data-client_id="243689444748-m3tnlqlhm2m8sm52p1gf5nepbroodk33.apps.googleusercontent.com
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-logo_alignment="left" style="margin-bottom: 20px;"></div>

  <p style="text-align: center; color: #aab1ca;">─── OR ───</p>

  <form id="f">
    <div class="field"><label>Full name</label><input name="name" required></div>
    <div class="field"><label>Email</label><input name="email" type="email" required></div>
    <div class="field"><label>Mobile number</label><input name="phone" inputmode="tel" placeholder="07XXXXXXXX" required></div>
    <div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div>
    <div class="field"><label>Referral code (optional)</label><input name="referral_code"></div>
    <button class="pay" type="submit">Sign up with Email</button>
  </form>
  <div id="msg" class="message"></div>
  <p class="auth-switch">Already have an account? <a href="/login.html">Login</a></p>
  <a class="back-link" href="/index.html">← Back</a>
</div></main>
<script src="/js/api.js"></script>
<script>
function handleCredentialResponse(response) {
  api("/api/auth/google", { method: "POST", body: JSON.stringify({ credential: response.credential }) })
    .then(j => { setToken(j.token); location.href = j.redirect; })
    .catch(err => alert(err.message));
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    const j = await api("/api/register", { method: "POST", body: JSON.stringify(body) });
    setToken(j.token); location.href = j.redirect;
  } catch (err) { document.getElementById("msg").textContent = err.message; }
});
</script></body></html>
