<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — EduPoint AI</title>
<link rel="stylesheet" href="/css/style.css">
</head><body>
<header class="topbar">
  <div class="brand">🎓 EduPoint AI <span>v10</span></div>
  <nav class="top-actions">
    <span id="hello"></span>
    <a class="nav-btn" href="#" onclick="logout();return false;">Logout</a>
  </nav>
</header>
<main class="container">
  <section class="hero">
    <p class="eyebrow">STUDENT DASHBOARD</p>
    <h1>Your EduPoint AI account</h1>
    <p id="creditStatus" style="font-size: 20px; font-weight: bold; color: #73e8ff;">Loading credits...</p>
  </section>

  <section class="card">
    <h2>🎯 Cluster Points Calculator</h2>
    <p>Enter at least 7 grades separated by commas.</p>
    <textarea id="grades" rows="4" placeholder="A, B+, B, B-, C+, C, C"></textarea>
    <button class="pay" id="cb" type="button" style="margin-top: 15px;">Calculate</button>
    
    <div id="cr" class="message"></div>
    
    <!-- Results Area -->
    <div id="calcResult" style="display:none; margin-top: 20px; border-top: 1px solid #303451; padding-top: 20px;">
      <h3>Your Results</h3>
      <p id="cpDisplay" style="font-size: 18px; font-weight: bold; color: #c9ffda;"></p>
      <p style="color: #72dfff; font-size: 14px;">📧 A PDF copy of this report has been sent to your email.</p>
    </div>
  </section>
  
  <!-- Add other tools below if needed (Scholarships, Chatbot) -->
</main>

<script src="/js/api.js"></script>
<script>
const $ = id => document.getElementById(id);
let me;

(async function () {
  const r = await requireAuth(); if (!r) return;
  me = r.user;
  $("hello").textContent = "Hi, " + me.name;
  updateCreditsUI(r.credits);
})();

function updateCreditsUI(credits) {
  if (credits > 0) {
    $("creditStatus").textContent = `✅ You have ${credits} calculation(s) available.`;
    $("creditStatus").style.color = "#c9ffda";
  } else {
    $("creditStatus").textContent = `🔒 You have 0 calculations left. Please pay 100 KES.`;
    $("creditStatus").style.color = "#ff7b7b";
  }
}

$("cb").onclick = async () => {
  $("cr").textContent = "Calculating...";
  $("calcResult").style.display = "none";
  
  const obj = {};
  $("grades").value.split(",").forEach((v, i) => obj[i] = v.trim());
  
  try {
    const d = await api("/api/calculate", { method: "POST", body: JSON.stringify({ grades: obj }) });
    
    $("cr").textContent = "";
    $("calcResult").style.display = "block";
    $("cpDisplay").textContent = `Cluster points: ${d.cluster_points} — ${d.results.filter(x => x.match === "qualified").length} matching courses.`;
    
    updateCreditsUI(d.credits_left);

  } catch (err) {
    if (err.status === 402) {
      $("cr").innerHTML = `
        <div style="background: rgba(255,0,0,0.1); padding: 15px; border-radius: 8px; border: 1px solid #ff7b7b; margin-top: 15px;">
          <b>No calculations left!</b><br>Pay 100 KES to unlock 1 more calculation.<br><br>
          <button class="pay" onclick="triggerPayment('${me.phone || '0700000000'}')">Pay 100 KES Now</button>
        </div>
      `;
    } else {
      $("cr").textContent = err.message;
    }
  }
};

async function triggerPayment(phone) {
  try {
    $("cr").textContent = "Starting payment...";
    const j = await api("/api/payment/initiate", { 
      method: "POST", 
      body: JSON.stringify({ plan: "standard", provider: "pesapal", phone: phone })
    });
    
    if (j.redirect_url) {
      const w = 600, h = 700;
      const left = (screen.width/2)-(w/2);
      const top = (screen.height/2)-(h/2);
      window.open(j.redirect_url, 'Pesapal Payment', `width=${w},height=${h},top=${top},left=${left}`);
      
      $("cr").textContent = "Waiting for payment confirmation... (Do not close this tab)";
      
      let n = 0;
      const t = setInterval(async () => {
        n++;
        const x = await api("/api/payment/status/" + j.transaction_id);
        
        if (x.payment.status === "paid" || x.payment.status === "completed") {
          clearInterval(t);
          alert("Payment Confirmed! You now have 1 new calculation.");
          location.reload(); 
        }
        if (x.payment.status === "failed" || n >= 60) {
           clearInterval(t);
           $("cr").textContent = "Payment failed or timed out.";
        }
      }, 3000);
    }
  } catch (err) { $("cr").textContent = err.message; }
}
</script></body></html>
