<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Centre — EduPoint AI</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .dashboard-layout { display: flex; min-height: 100vh; background: #080916; }
  .sidebar { width: 260px; background: #0b0d1d; border-right: 1px solid #303451; padding: 20px; display: flex; flex-direction: column; gap: 5px; }
  .sidebar h3 { color: #73e8ff; font-size: 11px; letter-spacing: 1px; margin: 15px 0 5px 10px; text-transform: uppercase; }
  .sidebar a { color: #aab1ca; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; }
  .sidebar a:hover, .sidebar a.active { background: #1a1c33; color: #fff; }
  .main-content { flex: 1; padding: 30px; }
  
  .quiz-card { background: #111326; border: 1px solid #303451; border-radius: 12px; padding: 30px; max-width: 600px; }
  .question { font-size: 18px; color: #fff; margin-bottom: 20px; font-weight: bold; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { background: #080a18; border: 1px solid #303451; padding: 15px; border-radius: 8px; color: #fff; cursor: pointer; transition: 0.2s; }
  .option:hover { border-color: #73e8ff; }
  .option.correct { background: rgba(74,222,128,0.2); border-color: #4ade80; }
  .option.wrong { background: rgba(255,123,123,0.2); border-color: #ff7b7b; }
</style>
</head><body>
<div class="dashboard-layout">
  <div class="sidebar">
    <div class="brand" style="font-size: 18px; margin-bottom: 20px;">🎓 EduPoint AI</div>
    <h3>Academics</h3>
    <a href="/dashboard.html">🏠 Overview</a>
    <a href="/history.html">📊 Calculation History</a>
    <a href="/comparison.html">⚖️ Academic Comparison</a>
    <a href="/courses.html">🎓 My Courses</a>
    <h3>Opportunities</h3>
    <a href="/scholarships.html">💰 Scholarships</a>
    <h3>Services</h3>
    <a href="/careers.html">💼 CV & Careers</a>
    <a href="/learning.html" class="active">📚 Learning Centre</a>
    <a href="#" onclick="logout(); return false;" style="color: #ff7b7b; margin-top: 20px;">🚪 Logout</a>
  </div>

  <div class="main-content">
    <h1 style="font-size: 28px; margin-bottom: 5px;">Learning Centre</h1>
    <p style="color: #aab1ca; margin-bottom: 20px;">Test your knowledge with practice questions.</p>

    <div class="quiz-card" id="quizBox">
      <h3 style="color: #73e8ff; margin-top: 0;">Mathematics Quiz</h3>
      <div class="question" id="qText">Loading...</div>
      <div class="options" id="qOptions"></div>
      <button class="pay" id="nextBtn" style="display: none; margin-top: 20px;" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const QUESTIONS = [
  { q: "What is the derivative of x²?", options: ["2x", "x", "x³", "2"], answer: 0 },
  { q: "Solve for x: 2x + 5 = 15", options: ["5", "10", "7.5", "20"], answer: 0 },
  { q: "What is the chemical symbol for Gold?", options: ["Ag", "Au", "Gd", "Go"], answer: 1 },
  { q: "Which planet is known as the Red Planet?", options: ["Venus", "Jupiter", "Mars", "Saturn"], answer: 2 },
  { q: "What is the value of Pi (to 2 decimal places)?", options: ["3.14", "3.15", "3.12", "3.16"], answer: 0 }
];

let currentQ = 0;
let score = 0;
let answered = false;

(async function init() {
  const r = await requireAuth(); if (!r) return;
  loadQuestion();
})();

function loadQuestion() {
  if (currentQ >= QUESTIONS.length) {
    finishQuiz(); return;
  }
  
  answered = false;
  const q = QUESTIONS[currentQ];
  document.getElementById("qText").textContent = `Q${currentQ + 1}: ${q.q}`;
  document.getElementById("nextBtn").style.display = "none";
  
  const optsBox = document.getElementById("qOptions");
  optsBox.innerHTML = q.options.map((opt, index) => 
    `<div class="option" onclick="checkAnswer(${index})" id="opt-${index}">${opt}</div>`
  ).join("");
}

function checkAnswer(selected) {
  if (answered) return;
  answered = true;
  
  const correct = QUESTIONS[currentQ].answer;
  const opts = document.querySelectorAll(".option");
  
  opts[correct].classList.add("correct");
  if (selected !== correct) {
    opts[selected].classList.add("wrong");
  } else {
    score++;
  }
  
  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  currentQ++;
  loadQuestion();
}

async function finishQuiz() {
  document.getElementById("qText").textContent = `Quiz Complete!`;
  document.getElementById("qOptions").innerHTML = `<p style="color: #4ade80; font-size: 20px; font-weight: bold;">You scored ${score} out of ${QUESTIONS.length}</p>`;
  document.getElementById("nextBtn").style.display = "none";
  
  try {
    await api("/api/learning/quiz", { 
      method: "POST", 
      body: JSON.stringify({ subject: "General Math & Science", score: score, total: QUESTIONS.length }) 
    });
  } catch(e) { console.error("Failed to save score"); }
}
</script>
</body></html>
