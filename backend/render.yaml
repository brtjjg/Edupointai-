services:
  - type: web
    name: edupoint-api
    runtime: python
    plan: free                     # change to 'starter' for production
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 3 -k gthread --timeout 60 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: edupoint-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: PAYMENTS_PROVIDERS
        value: pesapal
      - key: PESAPAL_ENV
        value: sandbox               # switch to 'production' later
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CURRENCY
        value: KES
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: edupoint-db
    databaseName: edupoint
    user: edupoint
    plan: free                       # change to 'basic-256mb' for production
