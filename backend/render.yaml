services:
  - type: web
    name: edupoint-api
    runtime: python
    rootDir: backend
    plan: free                     
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 3 -k gthread --timeout 60 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        sync: false               # <--- CHANGED: Now asks you for the link instead of creating a DB
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: PAYMENTS_PROVIDERS
        value: pesapal
      - key: PESAPAL_ENV
        value: sandbox               
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CURRENCY
        value: KES
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# (The "databases:" block at the bottom is completely deleted)
